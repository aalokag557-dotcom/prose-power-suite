<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Text Analyzer Pro ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.js"></script>
<style>
:root {
  --gradient-bg: linear-gradient(135deg, #2b1055, #7597de);
  --card-bg: rgba(255, 255, 255, 0.08);
  --accent: #00ffff;
  --text: #ffffff;
}
body.dark {
  --gradient-bg: linear-gradient(135deg, #111, #1f1f1f);
  --card-bg: rgba(255, 255, 255, 0.06);
  --accent: #00bcd4;
  --text: #ffffff;
}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: var(--gradient-bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
h1 {
  text-align: center;
  margin: 10px 0;
  font-size: 1.8rem;
}
.container {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 15px;
  width: 90%;
  max-width: 850px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
  overflow-y: auto;
  max-height: 85vh;
}
.container::-webkit-scrollbar { display: none; }

textarea {
  width: 100%;
  height: 130px;
  border: none;
  outline: none;
  resize: none;
  border-radius: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.15);
  color: var(--text);
  font-size: 1rem;
  caret-color: var(--accent);
}
textarea::placeholder {
  color: #a0aec0;
}
button {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 10px;
  margin: 4px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { transform: scale(1.05); }
.toggle-mode {
  background: linear-gradient(135deg, #10b981, #3b82f6);
}
.card {
  background: var(--card-bg);
  border-radius: 15px;
  padding: 10px;
  margin-top: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
canvas {
  width: 100%;
  max-height: 220px;
}
.notification {
  position: fixed;
  top: 15px;
  right: 20px;
  background: rgba(0, 200, 255, 0.85);
  padding: 8px 18px;
  border-radius: 8px;
  color: #fff;
  display: none;
  animation: fadeInOut 2s ease;
  z-index: 999;
}
@keyframes fadeInOut {
  0% {opacity: 0;}
  10% {opacity: 1;}
  90% {opacity: 1;}
  100% {opacity: 0;}
}
</style>
</head>
<body>
<h1>✨ Text Analyzer Pro</h1>
<div class="container">
  <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
  <div>
    <button onclick="copyText()">📋 Copy</button>
    <button onclick="clearText()">🧹 Clear</button>
    <button onclick="downloadText()">💾 Download</button>
    <button class="toggle-mode" onclick="toggleMode()">🌙 Theme</button>
  </div>

  <div class="card">
    <h3>📊 Basic Analysis</h3>
    <p id="analysis"></p>
  </div>

  <div class="card">
    <h3>🔑 Keyword Frequency</h3>
    <canvas id="freqChart"></canvas>
  </div>

  <div class="card">
    <h3>☁️ Word Cloud</h3>
    <canvas id="wordCloud"></canvas>
  </div>

  <div class="card">
    <h3>😊 Sentiment & Language</h3>
    <p id="sentiment"></p>
  </div>
</div>

<div id="notify" class="notification"></div>

<script>
const inputText = document.getElementById("inputText");
const analysis = document.getElementById("analysis");
const sentimentEl = document.getElementById("sentiment");
const freqChartCtx = document.getElementById("freqChart");
const notify = document.getElementById("notify");
let chart;

function showNotify(msg) {
  notify.innerText = msg;
  notify.style.display = "block";
  setTimeout(() => (notify.style.display = "none"), 2000);
}

function analyzeText() {
  const text = inputText.value.trim();
  if (!text) {
    analysis.innerHTML = "No text entered.";
    sentimentEl.innerHTML = "";
    updateChart([]);
    WordCloud(document.getElementById('wordCloud'), { list: [] });
    return;
  }

  const words = text.match(/\b(\w+)\b/g) || [];
  const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
  const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
  const wordCount = words.length;
  const charCount = text.length;
  const readingTime = (wordCount / 200).toFixed(2);

  analysis.innerHTML = `
    <b>Words:</b> ${wordCount}<br>
    <b>Characters:</b> ${charCount}<br>
    <b>Sentences:</b> ${sentences.length}<br>
    <b>Paragraphs:</b> ${paragraphs.length}<br>
    <b>Reading Time:</b> ${readingTime} min
  `;

  const freq = {};
  words.forEach(w => {
    const lw = w.toLowerCase();
    freq[lw] = (freq[lw] || 0) + 1;
  });
  const sorted = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);
  updateChart(sorted);

  WordCloud(document.getElementById('wordCloud'), {
    list: sorted,
    color: 'random-dark',
    backgroundColor: 'transparent'
  });

  const pos = ["good","great","awesome","happy","love","excellent","fantastic","positive"];
  const neg = ["bad","sad","terrible","hate","angry","horrible","negative"];
  let score = 0;
  words.forEach(w=>{
    if(pos.includes(w.toLowerCase())) score++;
    if(neg.includes(w.toLowerCase())) score--;
  });
  let mood = score>0 ? "😊 Positive" : score<0 ? "☹️ Negative" : "😐 Neutral";

  let lang = "English";
  if(/[अ-ह]/.test(text)) lang = "Hindi";
  else if(/[а-я]/.test(text)) lang = "Russian";
  else if(/[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text)) lang = "Korean";

  sentimentEl.innerHTML = `<b>Sentiment:</b> ${mood}<br><b>Language:</b> ${lang}`;
}

function updateChart(data) {
  const labels = data.map(d => d[0]);
  const values = data.map(d => d[1]);
  if (chart) chart.destroy();
  chart = new Chart(freqChartCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Word Frequency',
        data: values,
        backgroundColor: ['#06b6d4','#3b82f6','#9333ea','#f59e0b','#10b981','#8b5cf6','#ec4899','#14b8a6','#f43f5e','#6366f1']
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true, ticks: { color: '#fff' } },
        x: { ticks: { color: '#fff' } }
      },
      plugins: { legend: { labels: { color: '#fff' } } }
    }
  });
}

function copyText() {
  navigator.clipboard.writeText(inputText.value);
  showNotify("Copied!");
}
function clearText() {
  inputText.value = "";
  analyzeText();
}
function downloadText() {
  const blob = new Blob([inputText.value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "text-analysis.txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showNotify("Downloaded to your Downloads folder!");
}
function toggleMode() {
  document.body.classList.toggle("dark");
  showNotify("Theme toggled!");
}
inputText.addEventListener("input", analyzeText);
</script>
</body>
</html>
